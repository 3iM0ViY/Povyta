<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Povyta</title>
	<link rel="stylesheet" href="../static/css.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fleur+De+Leah&family=Yanone+Kaffeesatz:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>
	<div id="rain"></div>
	<div class="banner">
		<div class="slider" style="--quantity: 8">
			<div class="item" style="--position: 1"><img src="../img/fate.jpg" alt="Fate"></div>
			<div class="item" style="--position: 2"><img src="../img/iakym.jpg" alt="Iakym"></div>
			<div class="item" style="--position: 3"><img src="../img/lamp.jpg" alt="Lamp"></div>
			<div class="item" style="--position: 4"><img src="../img/find.jpeg" alt="Find"></div>
			<div class="item" style="--position: 5"><img src="../img/kozhyn.jpeg" alt="Kozhyn"></div>
			<div class="item" style="--position: 6"><img src="../img/vdng.jpeg" alt="VDNG"></div>
			<div class="item" style="--position: 7"><img src="../img/melancholy.jpg" alt="Melancholy"></div>
			<div class="item" style="--position: 8"><img src="../img/park.jpg" alt="Park"></div>
		</div>
		<div class="content">
			<h1 data-content="Povyta">
				Povyta
			</h1>
			<div class="side_text">
				<h2>Звільни</h2>
				<p><a href="https://tunelink.to/OUTXa" target="_blank" rel="noopener noreferrer"><b>Посилання на трек</b></a></p>
				<p>
					<a href="https://send.monobank.ua/jar/55NvMKJW1E" target="_blank" rel="noopener noreferrer">Донать на авто для Азову!</a>
				</p>
			</div>
			<div class="model" id="maskparent">
				<img id="mask" src="../img/logo.png" alt="Povyta Logo">
			</div>
		</div>
	</div>

<script>
	function rain(){
		let amount = window.innerWidth < 768 ? 50 : window.innerWidth < 1024 ? 100 : 150;
		let body = document.querySelector('#rain');
		let i = 1;
		while(i < amount){
			let drop = document.createElement('i');
			let size = Math.random() * 5;
			let posX = Math.floor(Math.random() * window.innerWidth);
			let delay = Math.random() * -20;
			let duration = Math.random() * 15;

			drop.style.left = posX + 'px';
			drop.style.animationDelay = delay+'s';
			drop.style.animationDuration = 2 + duration + 's';
			body.appendChild(drop);
			i++;
		}
	}
	rain();

	// Regenerate rain on window resize
	let resizeTimer;
	window.addEventListener('resize', () => {
		clearTimeout(resizeTimer);
		resizeTimer = setTimeout(() => {
			document.querySelector('#rain').innerHTML = '';
			rain();
		}, 250);
	});
</script>
<script>
// Only enable 3D tilt on non-touch devices
if (!('ontouchstart' in window)) {
	document.querySelectorAll('.banner .slider .item').forEach(item => {
		const img = item.querySelector('img');

		item.addEventListener('mousemove', e => {
			const rect = item.getBoundingClientRect();
			const x = e.clientX - rect.left;
			const y = e.clientY - rect.top;
			const rotateX = ((y / rect.height) - 0.5) * -20;
			const rotateY = ((x / rect.width) - 0.5) * 20;
			img.style.transform = `scale(1.1) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
		});

		item.addEventListener('mouseleave', () => {
			img.style.transform = 'scale(1) rotateX(0) rotateY(0)';
		});
	});
}
</script>
<script>
(() => {
	const slider = document.querySelector('.banner .slider');
	if (!slider) return;

	// Adjust base duration based on screen size
	const isMobile = window.innerWidth < 768;
	const baseDuration = isMobile ? 40 : 50;
	const baseSpeed = 360 / baseDuration;

	const hoverFactor = 0.25;
	const speedSmoothing = 0.08;

	let startingAngle = 0;
	const animations = slider.getAnimations ? slider.getAnimations() : [];
	if (animations && animations.length) {
		let anim = animations.find(a => (a.effect && a.effect.getKeyframes && a.effect.getKeyframes().some(k => {
			return (k.transform && String(k.transform).includes('rotateY'));
		}))) || animations[0];

		try {
			const timing = anim.effect.getTiming ? anim.effect.getTiming() : null;
			const dur = timing && timing.duration ? timing.duration : baseDuration * 1000;
			const ct = anim.currentTime != null ? anim.currentTime : 0;
			const progress = ((ct % dur) + dur) % dur / dur;
			startingAngle = progress * 360;
		} catch (e) {
			startingAngle = 0;
		}

		try { anim.cancel(); } catch (e) { /* ignore */ }
	} else {
		const cs = getComputedStyle(slider).transform;
		if (cs && cs !== 'none') {
			const m = cs.match(/matrix3d\(([-0-9e., ]+)\)/) || cs.match(/matrix\(([-0-9e., ]+)\)/);
			if (m) {
				const vals = m[1].split(',').map(v => parseFloat(v));
				if (vals.length === 16) {
					const m11 = vals[0], m13 = vals[2];
					startingAngle = Math.atan2(m13, m11) * 180 / Math.PI;
				} else if (vals.length === 6) {
					startingAngle = 0;
				}
			}
		}
	}

	let angle = startingAngle;
	let currentSpeed = baseSpeed;
	let targetSpeed = baseSpeed;
	let lastTs = null;

	const baseTransformPrefix = 'perspective(1250px) rotateX(-22deg)'; 

	function raf(ts) {
		if (lastTs == null) lastTs = ts;
		const dt = (ts - lastTs) / 1000;
		lastTs = ts;

		currentSpeed += (targetSpeed - currentSpeed) * speedSmoothing;
		angle = (angle + currentSpeed * dt) % 360;

		slider.style.transform = `${baseTransformPrefix} rotateY(${angle}deg)`;

		requestAnimationFrame(raf);
	}
	requestAnimationFrame(raf);

	// Only enable hover slowdown on non-touch devices
	if (!('ontouchstart' in window)) {
		slider.addEventListener('mouseenter', () => {
			targetSpeed = baseSpeed * hoverFactor;
		});
		slider.addEventListener('mouseleave', () => {
			targetSpeed = baseSpeed;
		});
	}
})();
</script>

</body>
</html>
