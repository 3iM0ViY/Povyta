<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Povyta</title>
	<link rel="stylesheet" href="../static/css.css">
	<style>
		
		*{
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body{
			background-color: #0a0615;
			background-image:
			repeating-linear-gradient(
				to right, transparent 0 100px,
				#babaca 100px 101px
			),
		}
	</style>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fleur+De+Leah&family=Yanone+Kaffeesatz:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>
	<div id="rain"></div>
	<div class="banner">
		<div class="slider" style="--quantity: 8">
			<div class="item" style="--position: 1"><img src="../img/fate.jpg" alt=""></div>
			<div class="item" style="--position: 2"><img src="../img/iakym.jpg" alt=""></div>
			<div class="item" style="--position: 3"><img src="../img/lamp.jpg" alt=""></div>
			<div class="item" style="--position: 4"><img src="../img/find.jpeg" alt=""></div>
			<div class="item" style="--position: 5"><img src="../img/kozhyn.jpeg" alt=""></div>
			<div class="item" style="--position: 6"><img src="../img/vdng.jpeg" alt=""></div>
			<div class="item" style="--position: 7"><img src="../img/melancholy.jpg" alt=""></div>
			<div class="item" style="--position: 8"><img src="../img/park.jpg" alt=""></div>
		</div>
		<div class="content">
			<h1 data-content="Povyta">
				Povyta
			</h1>
			<div class="side_text">
				<h2>Звільни</h2>
				<p><a href="https://tunelink.to/OUTXa" target="_blank"><b>Посилання на трек</b></a></p>
				<p>
					<a href="https://send.monobank.ua/jar/55NvMKJW1E" target="_blank">Донать на авто для Азову!</a>
				</p>
			</div>
			<div class="model" id="maskparent">
				<img id="mask" src="../img/logo.png" alt="model logo">
			</div>
		</div>
	</div>


<script>
	function rain(){
		let amount = 150;
		let body = document.querySelector('#rain');
		let i = 1;
		while(i < amount){
			let drop = document.createElement('i');
			let size = Math.random() * 5;
			let posX = Math.floor(Math.random() * window.innerWidth);
			let delay = Math.random() * -20;
			let duration = Math.random() * 15;

			drop.style.left = posX + 'px';
			drop.style.animationDelay = delay+'s';
			drop.style.animationDuration = 2 + duration + 's';
			body.appendChild(drop);
			i++;
		}
	}
	rain();
</script>
</body>
</html>
