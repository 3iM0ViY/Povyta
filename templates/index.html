<body>
	<div id="rain"></div>
	<div class="banner">

		<div class="content">

<script>
	function rain(){
		let amount = 150;
		let body = document.querySelector('#rain');
		let i = 1;
		while(i < amount){
			let drop = document.createElement('i');
			let size = Math.random() * 5;
			let posX = Math.floor(Math.random() * window.innerWidth);
			let delay = Math.random() * -20;
			let duration = Math.random() * 15;

			drop.style.left = posX + 'px';
			drop.style.animationDelay = delay+'s';
			drop.style.animationDuration = 2 + duration + 's';
			body.appendChild(drop);
			i++;
		}
	}
	rain();
</script>
<script>
document.querySelectorAll('.banner .slider .item').forEach(item => {
	const img = item.querySelector('img');

	item.addEventListener('mousemove', e => {
		const rect = item.getBoundingClientRect();
		const x = e.clientX - rect.left;
		const y = e.clientY - rect.top;
		const rotateX = ((y / rect.height) - 0.5) * -20;
		const rotateY = ((x / rect.width) - 0.5) * 20;
		img.style.transform = `scale(1.1) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
	});

	item.addEventListener('mouseleave', () => {
		img.style.transform = 'scale(1) rotateX(0) rotateY(0)';
	});
});
</script>
<script>
(() => {
	const slider = document.querySelector('.banner .slider');
	if (!slider) return;

	// base duration (seconds) — match your original CSS default
	const baseDuration = 50;
	const baseSpeed = 360 / baseDuration; // deg/s

	// slower factor when hovered (0.25 => 4x slower)
	const hoverFactor = 0.25;

	// smoothing factor for speed changes (0..1). Larger -> faster
	const speedSmoothing = 0.08;

	// try to obtain the currently running CSS animation to read its progress
	let startingAngle = 0;
	const animations = slider.getAnimations ? slider.getAnimations() : [];
	if (animations && animations.length) {
		// find an animation that animates rotateY or the one named 'autoRun'
		let anim = animations.find(a => (a.effect && a.effect.getKeyframes && a.effect.getKeyframes().some(k => {
			return (k.transform && String(k.transform).includes('rotateY'));
		}))) || animations[0];

		try {
			const timing = anim.effect.getTiming ? anim.effect.getTiming() : null;
			const dur = timing && timing.duration ? timing.duration : baseDuration * 1000;
			const ct = anim.currentTime != null ? anim.currentTime : 0;
			// progress from 0..1
			const progress = ((ct % dur) + dur) % dur / dur;
			startingAngle = progress * 360;
		} catch (e) {
			// fallback: leave startingAngle = 0
			startingAngle = 0;
		}

		// cancel CSS animation so we can control transform without restarts
		try { anim.cancel(); } catch (e) { /* ignore */ }
	} else {
		// no CSS animation found — start at current computed transform if possible
		const cs = getComputedStyle(slider).transform;
		if (cs && cs !== 'none') {
			// try to parse rotateY from matrix3d or matrix (best-effort)
			const m = cs.match(/matrix3d\(([-0-9e., ]+)\)/) || cs.match(/matrix\(([-0-9e., ]+)\)/);
			if (m) {
				const vals = m[1].split(',').map(v => parseFloat(v));
				// try a heuristic: when rotationX is small, angleY ~ atan2(m13, m11)
				if (vals.length === 16) {
					const m11 = vals[0], m13 = vals[2];
					startingAngle = Math.atan2(m13, m11) * 180 / Math.PI;
				} else if (vals.length === 6) {
					// 2D matrix - no rotateY; ignore
					startingAngle = 0;
				}
			}
		}
	}

	// state
	let angle = startingAngle; // current rotateY degrees
	let currentSpeed = baseSpeed; // deg/s (smoothed)
	let targetSpeed = baseSpeed; // deg/s
	let lastTs = null;

	// ensure slider keeps the same perspective/rotateX baseline as CSS keyframes
	// (match what you had in CSS: perspective(1250px) rotateX(-22deg))
	const baseTransformPrefix = 'perspective(1250px) rotateX(-22deg)'; 

	// Start RAF loop
	function raf(ts) {
		if (lastTs == null) lastTs = ts;
		const dt = (ts - lastTs) / 1000; // seconds
		lastTs = ts;

		// smooth speed toward target
		currentSpeed += (targetSpeed - currentSpeed) * speedSmoothing;

		// update angle
		angle = (angle + currentSpeed * dt) % 360;

		// apply transform
		slider.style.transform = `${baseTransformPrefix} rotateY(${angle}deg)`;

		requestAnimationFrame(raf);
	}
	requestAnimationFrame(raf);

	// Hover handling: change targetSpeed smoothly
	slider.addEventListener('mouseenter', () => {
		targetSpeed = baseSpeed * hoverFactor;
	});
	slider.addEventListener('mouseleave', () => {
		targetSpeed = baseSpeed;
	});
})();
</script>

</body>
</html>
